launch:

- node:
    pkg: "rosmav"
    exec: "bluerov2_hardware_interface"
    name: "bluerov2_hardware_interface"
    namespace: ""

- node:
    pkg: "rosmav"
    exec: "bluerov2_camera_interface"
    name: "bluerov2_camera_interface"
    namespace: ""

- node:
    pkg: "gary_the_snail"
    exec: "depth_hold"
    name: "bluerov2_depth_hold"
    namespace: "rov1"

- node:
    pkg: "gary_the_snail"
    exec: "depth_publisher"
    name: "bluerov2_depth_publisher"
    namespace: "rov1"

- node:
    pkg: "gary_the_snail"
    exec: "heading_control"
    name: "bluerov2_heading_control"
    namespace: "rov1"

- node:
    pkg: "gary_the_snail"
    exec: "control"
    name: "bluerov2_control"
    namespace: "rov1"

